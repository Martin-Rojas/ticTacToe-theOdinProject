<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Tic Tac Toe game</title>
  </head>
  <body>
    
    <div class="container">
      <h1>Tic Tac Toe game</h1>
      <div class="form ">
        <form action="" id="form">
          <label for="player1" >Enter player 1 name:</label>
          <input type="text" id="player1" placeholder="Player 1 Name">
          <label for="player2">Enter player 2 name:</label>
          <input type="text" id="player2" placeholder="Player 2 Name">
          
          <input type="submit" value="Start game">
        </form>
      </div>
      <div class="game-board " id="game-board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
        <h2 id="game-result"></h2>
      </div>
      <p id="player1-name"></p>
      <p id="player2-name"></p>
      <button id="reset">Reset Game</button>
      <button id="newGame">New Game</button>
    </div>
    
  </body>
  <script src="./app.js"></script>
</html>
